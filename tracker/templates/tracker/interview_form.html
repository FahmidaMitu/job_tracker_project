{% extends 'tracker/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Schedule Interview</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Bootstrap styled form rendering -->
                        {{ form.as_p }}
                        
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Save Interview</button>
                            <a href="{% url 'application_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Optional: Some basic styling for default form inputs to match bootstrap -->
<style>
    .card-body form p {
        margin-bottom: 1rem;
    }
    .card-body form p label {
        font-weight: 500;
        margin-bottom: 0.5rem;
        display: block;
    }
    .card-body form p input, 
    .card-body form p select, 
    .card-body form p textarea {
        width: 100%;
        padding: 0.375rem 0.75rem;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
    }
</style>
{% endblock %}
