{% extends 'tracker/base.html' %}

{% block content %}
<div class="card p-4 col-md-8 mx-auto">
    <h2>Add New Job Application</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-success">Save Application</button>
        <a href="{% url 'application_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
